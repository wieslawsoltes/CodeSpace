name: Browser and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-browser-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-browser-
            ${{ runner.os }}-nuget-
      - name: Compute application cache key
        id: app-key
        shell: bash
        run: |
          digest=$(git ls-files -z src global.json Directory.Build.props | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          sdk=$(dotnet --version)
          echo "key=${RUNNER_OS}-codespace-browser-v1-${sdk}-${digest}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiled
        with:
          path: artifacts/browser
          key: ${{ steps.app-key.outputs.key }}
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish Uno browser app
        if: steps.compiled.outputs.cache-hit != 'true'
        run: dotnet publish src/CodeSpace.App -f net10.0-browserwasm -c Release -p:CodeSpaceTargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/CodeSpace/ -o artifacts/browser
      - uses: actions/cache/save@v4
        if: steps.compiled.outputs.cache-hit != 'true'
        with:
          path: artifacts/browser
          key: ${{ steps.app-key.outputs.key }}
      - name: Stage static site and source archive
        run: |
          python3 tools/prepare-pages.py artifacts/browser artifacts/site
          git archive --format=zip -o artifacts/CodeSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: codespace-browser
          path: artifacts/site
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: artifacts/CodeSpace-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable regression gates
        run: |
          dotnet run --project tests/CodeSpace.Tests -c Release
          dotnet run --project tests/CodeSpace.ProtocolTests -c Release
          dotnet run --project tests/CodeSpace.FeatureTests -c Release
          npm test --prefix src/CodeSpace.ExtensionHost
          node --test tests/browser/platform-contracts.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-browser-build
          path: artifacts/performance.json
      - name: Install browser test tools
        run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Real Chromium interaction tests
        env:
          BASE_URL: http://127.0.0.1:4173/CodeSpace/
        shell: bash
        run: |
          mkdir -p artifacts/serve
          ln -s "$PWD/artifacts/site" artifacts/serve/CodeSpace
          python3 -m http.server 4173 --directory artifacts/serve > artifacts/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-interaction-results
          path: |
            artifacts/browser-tests
            artifacts/server.log
      - name: Pack and verify all eight reusable libraries
        shell: bash
        run: |
          for project in Core Editor Docking Languages Extensions Rendering.Skia Controls.Uno Workbench.Uno; do
            dotnet pack "src/CodeSpace.$project/CodeSpace.$project.csproj" -c Release -o artifacts/packages
          done
          npm pack ./src/CodeSpace.ExtensionHost --pack-destination artifacts/packages
          python3 tools/verify-packages.py artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: reusable-packages
          path: artifacts/packages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site and deployed commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          expected = os.environ['GITHUB_SHA']
          def read(path):
              request = urllib.request.Request(base + path + '?verify=' + expected,
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'CodeSpace-deployment-verifier'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8')
          for attempt in range(12):
              try:
                  info = json.loads(read('build-info.json'))
                  if info.get('commit') != expected:
                      raise RuntimeError('Public commit does not yet match: ' + repr(info))
                  if 'CodeSpace' not in read('index.html'):
                      raise RuntimeError('Unexpected public application document')
                  if 'createExtensionHost' not in read('extension-host/worker.mjs'):
                      raise RuntimeError('Browser extension worker is missing')
                  print('Verified public application, extension worker, and commit ' + expected)
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print('Deployment verification retry: ' + str(error), flush=True)
                  time.sleep(5)
          PY
