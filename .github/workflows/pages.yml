name: Browser and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish Uno browser app
        run: dotnet publish src/CodeSpace.App -f net10.0-browserwasm -c Release -p:CodeSpaceTargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/CodeSpace/ -o artifacts/browser
      - name: Stage static site and source archive
        run: |
          python3 tools/prepare-pages.py artifacts/browser artifacts/site
          git archive --format=zip -o artifacts/CodeSpace-source.zip HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Real Chromium interaction tests
        env:
          BASE_URL: http://127.0.0.1:4173/CodeSpace/
        shell: bash
        run: |
          mkdir -p artifacts/serve
          ln -s "$PWD/artifacts/site" artifacts/serve/CodeSpace
          python3 -m http.server 4173 --directory artifacts/serve > artifacts/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-interaction-results
          path: |
            artifacts/browser-tests
            artifacts/server.log
      - name: Pack all eight reusable libraries
        shell: bash
        run: |
          for project in Core Editor Docking Languages Extensions Rendering.Skia Controls.Uno Workbench.Uno; do
            dotnet pack "src/CodeSpace.$project/CodeSpace.$project.csproj" -c Release -o artifacts/packages
          done
          npm pack ./src/CodeSpace.ExtensionHost --pack-destination artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: reusable-packages
          path: artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: artifacts/CodeSpace-source.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - uses: actions/upload-artifact@v4
        with:
          name: codespace-browser
          path: artifacts/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
