name: Browser and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish Uno browser app
        run: dotnet publish src/CodeSpace.App -f net10.0-browserwasm -c Release -p:CodeSpaceTargetFrameworks=net10.0-browserwasm -o artifacts/browser
      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          root=$(find artifacts/browser -type f -name index.html -printf '%h\n' | head -n 1)
          test -n "$root"
          mkdir -p artifacts/site/extension-host
          cp -a "$root"/. artifacts/site/
          cp src/CodeSpace.ExtensionHost/*.mjs artifacts/site/extension-host/
          touch artifacts/site/.nojekyll
          printf '{"commit":"%s","version":"0.1.0"}\n' "$GITHUB_SHA" > artifacts/site/build-info.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Real Chromium interaction tests
        shell: bash
        run: |
          python3 -m http.server 4173 --directory artifacts/site > /tmp/codespace-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node tests/browser/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-interaction-results
          path: artifacts/browser-tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - uses: actions/upload-artifact@v4
        with:
          name: codespace-browser
          path: artifacts/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
