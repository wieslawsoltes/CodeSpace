name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run (tags publish; manual runs only build and upload artifacts)
        required: true
        default: '0.1.0'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_NAME: CodeSpace
  APP_PROJECT: src/CodeSpace.App
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          VERSION="$INPUT_VERSION"
          if [ "$REF_TYPE" = tag ]; then VERSION="${REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file executable
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" -c Release -f net10.0-desktop -r "$RID" --self-contained true \
            -p:CodeSpaceTargetFrameworks=net10.0-desktop \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" \
            -o "artifacts/desktop/$RID"
      - name: Package executable
        shell: bash
        run: |
          OUT="artifacts/desktop/$RID"
          find "$OUT" -name '*.pdb' -delete
          mkdir -p artifacts/dist
          BASE="$APP_NAME-$VERSION-$RID"
          if [[ "$RID" == win-* ]]; then
            mv "$OUT/$APP_NAME.App.exe" "$OUT/$APP_NAME.exe"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            (cd "$OUT" && zip -q "$GITHUB_WORKSPACE/artifacts/dist/$BASE.zip" "$APP_NAME.exe")
          else
            mv "$OUT/$APP_NAME.App" "$OUT/$APP_NAME"
            chmod +x "$OUT/$APP_NAME"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            tar -C "$OUT" -czf "artifacts/dist/$BASE.tar.gz" "$APP_NAME"
          fi
          ls -la artifacts/dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engines
        shell: bash
        run: |
          dotnet run --project tests/CodeSpace.Tests -c Release
          dotnet run --project tests/CodeSpace.ProtocolTests -c Release
          dotnet run --project tests/CodeSpace.FeatureTests -c Release
          npm test --prefix src/CodeSpace.ExtensionHost
          node --test tests/browser/platform-contracts.test.mjs
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Package libraries and source
        shell: bash
        run: |
          mkdir -p artifacts/release artifacts/packages
          # Only .NET projects are NuGet packages; the npm extension host (no .csproj) is packed separately below.
          for project in src/*/*.csproj; do
            case "$project" in *.App.csproj) continue;; esac
            dotnet pack "$project" -c Release -p:Version="$RELEASE_VERSION" -o artifacts/packages
          done
          npm pkg set version="$RELEASE_VERSION" --prefix src/CodeSpace.ExtensionHost
          npm pack ./src/CodeSpace.ExtensionHost --pack-destination artifacts/packages
          python3 tools/verify-packages.py artifacts/packages
          cp artifacts/packages/*.nupkg artifacts/packages/*.tgz artifacts/packages/package-manifest.json artifacts/release/
          git archive --format=zip -o "artifacts/release/CodeSpace-$RELEASE_VERSION-source.zip" HEAD
      - name: Publish browser archive
        run: |
          dotnet publish src/CodeSpace.App -f net10.0-browserwasm -c Release -p:CodeSpaceTargetFrameworks=net10.0-browserwasm -p:Version="$RELEASE_VERSION" -o artifacts/browser
          python3 tools/prepare-pages.py artifacts/browser artifacts/site
          cd artifacts/site && zip -qr "../release/CodeSpace-$RELEASE_VERSION-browser.zip" .
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts/release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd artifacts/release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codespace-release
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
      - name: Publish GitHub release for version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          PRE=()
          case "$RELEASE_VERSION" in *-*) PRE=(--prerelease);; esac
          cd artifacts/release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "CodeSpace $TAG" "${PRE[@]}" \
              --notes "Development preview. Read docs/compatibility.md. Extension compatibility is partial; executables are unsigned and not production-qualified. Desktop archives contain a self-contained single-file executable (no .NET install needed); native platform dependencies still apply. Node.js is optional and not bundled. NuGet packages are published to NuGet.org."
          fi

  nuget:
    name: Publish to NuGet.org (Trusted Publishing)
    needs: [version, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check NuGet user
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Set the NUGET_USER variable (your nuget.org profile name) for this repository or its nuget environment.' >&2; exit 1; }
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
