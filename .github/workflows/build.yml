name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build reusable engines
        run: dotnet build CodeSpace.slnx -c Release
      - name: Regression and randomized differential tests
        run: dotnet run --project tests/CodeSpace.Tests -c Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension API compatibility tests
        run: npm test --prefix src/CodeSpace.ExtensionHost
      - name: Package standalone extension host
        run: mkdir -p artifacts/packages && npm pack ./src/CodeSpace.ExtensionHost --pack-destination artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: extension-host-package
          path: artifacts/packages
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop Uno workbench
        run: dotnet build src/CodeSpace.App -f net10.0-desktop -c Release -p:CodeSpaceTargetFrameworks=net10.0-desktop
